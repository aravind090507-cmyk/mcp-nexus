version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mcp-nexus-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=Production
      - DATABASE_URL=sqlite:///./mcp_nexus.db
      - SECRET_KEY=mcp-nexus-enterprise-vault-supersecret-key-2026-xyz
      - LLM_PROVIDER=DEMO_DETERMINISTIC
      - LLM_MODEL=gemini-1.5-pro
    volumes:
      - ./backend/mcp_nexus.db:/app/mcp_nexus.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mcp-nexus-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
