name: MCP NEXUS CI & Enterprise Reliability Suite

on:
  push:
    branches: [ "main", "release/*", "fix/*", "remediation/*" ]
  pull_request:
    branches: [ "main", "release/*" ]

permissions:
  contents: read

jobs:
  backend-reliability:
    name: Backend Test Suite & Live PostgreSQL Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword2026
          POSTGRES_DB: mcp_nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio psycopg2-binary alembic

      - name: Run Alembic schema migrations against PostgreSQL 15
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql://postgres:postgrespassword2026@localhost:5432/mcp_nexus_test
        run: |
          python -m alembic -x db_url=$POSTGRES_TEST_DATABASE_URL upgrade head
          echo "Current Migration Revision:"
          python -m alembic -x db_url=$POSTGRES_TEST_DATABASE_URL current

      - name: Execute Complete Backend Test Suite
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql://postgres:postgrespassword2026@localhost:5432/mcp_nexus_test
          DATABASE_URL: sqlite:///./mcp_nexus.db
          SECRET_KEY: ci-test-secret-key-32-characters-long-enterprise
          ENVIRONMENT: Development
        run: |
          python -m pytest backend/app/tests -v --durations=10 --junitxml=backend-test-report.xml

      - name: Verify Strict Test Accounting & Critical Test Gates
        run: |
          python scripts/verify_ci_test_report.py backend-test-report.xml

      - name: Verify Database Integrity Contract & Clean Checkout Hygiene
        run: |
          python scripts/verify_database_integrity_contract.py

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build frontend distribution
        run: |
          cd frontend
          npm run build
